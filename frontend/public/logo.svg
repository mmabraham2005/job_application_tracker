<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Job Application Tracker logo">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5121AD"/>
      <stop offset="1" stop-color="#271072"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CEB8FF"/>
      <stop offset="1" stop-color="#9970F1"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A786F0"/>
      <stop offset="1" stop-color="#8360E5"/>
    </linearGradient>
  </defs>
  <!-- Handle and briefcase body: transparent outside the silhouette -->
  <path d="M194 168v-26c0-28 23-51 51-51h22c28 0 51 23 51 51v26h-35v-26c0-9-7-16-16-16h-22c-9 0-16 7-16 16v26z" fill="url(#body)"/>
  <rect x="61" y="163" width="390" height="306" rx="76" fill="url(#body)"/>
  <!-- Progress track -->
  <path d="M160 236c-27 0-43 15-43 41v111c0 27 16 42 43 42" stroke="url(#track)" stroke-width="17" fill="none" stroke-linecap="round"/>
  <circle cx="167" cy="236" r="25" fill="#BDA6FF"/>
  <circle cx="167" cy="311" r="25" fill="#A98BF5"/>
  <circle cx="167" cy="411" r="25" fill="#FFFFFF"/>
  <!-- Two open job-tracking steps -->
  <rect x="203" y="211" width="195" height="49" rx="24.5" fill="url(#track)"/>
  <rect x="203" y="286" width="202" height="49" rx="24.5" fill="url(#bar)"/>
  <!-- Completed application -->
  <rect x="203" y="382" width="203" height="55" rx="27.5" fill="#FFFFFF"/>
  <path d="m328 409 14 14 28-30" fill="none" stroke="#5430B9" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>